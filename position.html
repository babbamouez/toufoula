<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحديد موقعي (GPS)</title>
    
    <!-- إعدادات تطبيق الهاتف (PWA) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        body { font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
        .toast { transition: opacity 0.3s ease-in-out, transform 0.3s ease; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-gray-100 flex flex-col items-center justify-center min-h-screen p-4">
    
    <div class="bg-white p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-md border-t-4 border-blue-600 mb-6 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-400 to-blue-700"></div>
        
        <h2 class="text-2xl font-bold text-center text-blue-800 mb-6 mt-2">
            <i class="fas fa-map-marker-alt me-2 text-red-500 text-3xl align-middle"></i> تحديد الإحداثيات
        </h2>
        
        <!-- زر تثبيت التطبيقة (ظاهر دائماً) -->
        <button id="installBtn" class="w-full mb-6 bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white font-bold py-3 px-6 rounded-2xl transition duration-300 shadow-lg flex items-center justify-center text-lg transform hover:-translate-y-1">
            <i class="fas fa-download me-2"></i> تثبيت التطبيقة
        </button>

        <div class="mb-6 text-center">
            <button id="getLocationBtn" class="bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-bold py-4 px-6 rounded-2xl w-full transition duration-300 shadow-lg transform hover:-translate-y-1 text-lg">
                <i class="fas fa-location-arrow me-2"></i> جلب موقعي الحالي
            </button>
            <p id="statusText" class="text-sm text-gray-500 mt-4 h-5 font-bold"></p>
        </div>

        <!-- إحداثية X (خط العرض - Latitude) في الأعلى -->
        <div class="mb-5">
            <label class="block text-gray-700 font-bold mb-2 text-sm">إحداثية X (خط العرض - Latitude)</label>
            <div class="flex shadow-md rounded-xl overflow-hidden border border-gray-200 bg-gray-50 focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-200 transition-all">
                <input type="text" id="coordX" readonly class="w-full bg-transparent px-4 py-4 text-left font-mono text-2xl font-bold outline-none text-blue-900" placeholder="00.000000" dir="ltr">
                <button onclick="copyToClipboard('coordX', 'X')" class="bg-gray-800 hover:bg-gray-900 active:bg-black text-white px-6 py-4 transition duration-200 flex items-center justify-center min-w-[100px] text-lg font-bold">
                    <i class="fas fa-copy me-2"></i> نسخ
                </button>
            </div>
        </div>

        <!-- إحداثية Y (خط الطول - Longitude) في الأسفل -->
        <div class="mb-2">
            <label class="block text-gray-700 font-bold mb-2 text-sm">إحداثية Y (خط الطول - Longitude)</label>
            <div class="flex shadow-md rounded-xl overflow-hidden border border-gray-200 bg-gray-50 focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-200 transition-all">
                <input type="text" id="coordY" readonly class="w-full bg-transparent px-4 py-4 text-left font-mono text-2xl font-bold outline-none text-blue-900" placeholder="00.000000" dir="ltr">
                <button onclick="copyToClipboard('coordY', 'Y')" class="bg-gray-800 hover:bg-gray-900 active:bg-black text-white px-6 py-4 transition duration-200 flex items-center justify-center min-w-[100px] text-lg font-bold">
                    <i class="fas fa-copy me-2"></i> نسخ
                </button>
            </div>
        </div>
    </div>

    <!-- تذييل الصفحة -->
    <div class="text-center mt-2">
        <p class="font-extrabold text-lg mb-1 text-blue-900">تطبيقة خاصة بمنظومة الطفولة</p>
        <p class="text-sm font-bold bg-white text-gray-700 shadow-sm inline-block px-4 py-1.5 rounded-full mt-1 border border-gray-200">متفقد الطفولة -معز الببّا-</p>
    </div>

    <!-- نافذة الإشعارات (Toast) -->
    <div id="toast" class="toast fixed bottom-8 left-1/2 transform -translate-x-1/2 text-white px-6 py-3.5 rounded-full shadow-2xl opacity-0 pointer-events-none z-50 flex items-center text-base font-bold whitespace-nowrap border">
        <i id="toastIcon" class="fas me-2 text-white text-lg"></i>
        <span id="toastMsg"></span>
    </div>

    <script>
        // تفعيل ملف الخدمة (Service Worker)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        const installBtn = document.getElementById('installBtn');
        let deferredPrompt;

        // اعتراض حدث التثبيت لالتقاط الـ prompt وعرض الزر بوضوح
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                // إظهار نافذة تأكيد التثبيت الأصلية للمتصفح
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    showToast('جاري تثبيت التطبيقة على شاشتك...', 'fa-check-circle', false);
                }
                deferredPrompt = null;
            } else {
                // رسالة توجيهية إذا كانت التطبيقة مثبتة أو المتصفح لا يدعم التثبيت المباشر
                showToast('التطبيقة مثبتة مسبقاً، أو يتوجب إضافتها يدوياً عبر قائمة المتصفح (Add to Home Screen).', 'fa-info-circle', true);
            }
        });

        const getLocationBtn = document.getElementById('getLocationBtn');
        const coordXInput = document.getElementById('coordX');
        const coordYInput = document.getElementById('coordY');
        const statusText = document.getElementById('statusText');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        const toastIcon = document.getElementById('toastIcon');

        getLocationBtn.addEventListener('click', () => {
            if (!navigator.geolocation) {
                showError('متصفحك لا يدعم خاصية تحديد الموقع.');
                return;
            }

            statusText.innerHTML = '<i class="fas fa-spinner fa-spin text-blue-600"></i> جاري تحديد الموقع بدقة...';
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const x = position.coords.latitude.toFixed(6); 
                    const y = position.coords.longitude.toFixed(6); 
                    
                    coordXInput.value = x;
                    coordYInput.value = y;
                    
                    statusText.innerHTML = '<span class="text-green-600"><i class="fas fa-check-circle"></i> تم تحديد الموقع بنجاح</span>';
                },
                (error) => {
                    let errorMsg = 'حدث خطأ غير معروف.';
                    if (error.code === 1) errorMsg = 'الرجاء تفعيل خاصية الـ GPS وإعطاء الصلاحية للمتصفح.';
                    else if (error.code === 2) errorMsg = 'تعذر تحديد الموقع الحالي.';
                    else if (error.code === 3) errorMsg = 'انتهى وقت الطلب (حاول مجدداً).';
                    showError(errorMsg);
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        });

        function copyToClipboard(inputId, label) {
            const inputElement = document.getElementById(inputId);
            if (!inputElement.value || inputElement.value === "") {
                showError('لا توجد أرقام لنسخها.');
                return;
            }
            inputElement.select();
            inputElement.setSelectionRange(0, 99999); 
            try {
                navigator.clipboard.writeText(inputElement.value).then(() => {
                    showToast(`تم نسخ إحداثية ${label} بنجاح!`, 'fa-check-circle', false);
                }).catch(err => {
                    document.execCommand('copy');
                    showToast(`تم نسخ إحداثية ${label} بنجاح!`, 'fa-check-circle', false);
                });
            } catch(e) {
                document.execCommand('copy');
                showToast(`تم نسخ إحداثية ${label} بنجاح!`, 'fa-check-circle', false);
            }
            window.getSelection().removeAllRanges();
        }

        // دالة لعرض الإشعارات بألوان مختلفة
        function showToast(message, iconClass, isInfo = false) {
            toastMsg.innerText = message;
            
            // تغيير الألوان (أخضر للنجاح، أزرق غامق للمعلومات)
            toast.className = `toast fixed bottom-10 left-1/2 transform -translate-x-1/2 text-white px-6 py-3.5 rounded-full shadow-2xl flex items-center text-base font-bold whitespace-nowrap z-50 transition-all duration-300 ${isInfo ? 'bg-blue-800 border-blue-700' : 'bg-green-600 border-green-500'}`;
            toastIcon.className = `fas ${iconClass} me-2 text-white text-lg`;
            
            toast.classList.add('opacity-100', '-translate-y-2');
            setTimeout(() => {
                toast.classList.remove('opacity-100', '-translate-y-2');
            }, 3500);
        }

        // دالة لعرض الأخطاء باللون الأحمر
        function showError(message) {
            statusText.innerHTML = `<span class="text-red-500 font-bold"><i class="fas fa-exclamation-triangle"></i> ${message}</span>`;
            
            toastMsg.innerText = message;
            toast.className = `toast fixed bottom-10 left-1/2 transform -translate-x-1/2 text-white px-6 py-3.5 rounded-full shadow-2xl flex items-center text-base font-bold whitespace-nowrap z-50 transition-all duration-300 bg-red-600 border-red-500`;
            toastIcon.className = `fas fa-exclamation-circle me-2 text-white text-lg`;
            
            toast.classList.add('opacity-100', '-translate-y-2');
            setTimeout(() => {
                toast.classList.remove('opacity-100', '-translate-y-2');
            }, 3500);
        }
    </script>
</body>
</html>
